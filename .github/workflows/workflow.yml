name: CI
on:
  push:
    branches:
      - master
      - staging
      - develop
  pull_request:
    branches:
      - master
      - staging
      - develop
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Run vet
        run: go vet ./...
      - name: Check gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Run tests
        run: go test -race -v -coverprofile=profile.cov ./...
      - name: Send coverage
        uses: shogo82148/actions-goveralls@v1
        with:
          path-to-profile: profile.cov
          parallel: true
      - name: Run build
        run: go build ./...
      - name: Check cross-platform build
        run: GOOS=darwin go build ./... && GOOS=windows go build ./...
  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Code coverage (Coveralls)
        uses: shogo82148/actions-goveralls@v1
        with:
          parallel-finished: true
